syntax = "proto3";

package agent.model.v1;

service ModelExecution {
  rpc Execute(ModelInvocation) returns (stream ModelEvent);
}

message ModelInvocation {
  uint32 schema_version = 1;
  string tenant_id = 2;
  string run_id = 3;
  string session_id = 4;
  string attempt_id = 5;
  string worker_id = 6;
  string model_policy_id = 7;
  int64 expires_at_unix_ms = 8;
  repeated ModelMessage messages = 9;
  repeated ModelTool tools = 10;
  bytes output_schema_json = 11;
  ReasoningPolicy reasoning = 12;
  uint64 max_output_tokens = 13;
  string worker_incarnation_id = 14;
  bytes model_policy_snapshot_json = 15;
  string model_policy_digest = 16;
  // v4: exact protocol-neutral runtime policy accepted for this Run.
  bytes runtime_policy_snapshot_json = 17;
  string runtime_policy_digest = 18;
  // v5: complete immutable v20 Runtime invocation identity. These fields are
  // signed in workload-token schema v4 and must match before model egress.
  string application_id = 19;
  string workload_identity_id = 20;
  string workspace_id = 21;
  string agent_version_id = 22;
}

message ModelMessage {
  ModelRole role = 1;
  repeated ContentPart content = 2;
}

message ContentPart {
  oneof body {
    TextPart text = 1;
    MediaPart image = 2;
    MediaPart audio = 3;
    ToolResultPart tool_result = 4;
    ToolCallPart tool_call = 5;
    ReasoningPart reasoning = 6;
    RefusalPart refusal = 7;
  }
}

message TextPart {
  string text = 1;
}

message MediaPart {
  string media_type = 1;
  string source = 2;
}

message ToolResultPart {
  string tool_call_id = 1;
  bytes content_json = 2;
}

message ToolCallPart {
  string tool_call_id = 1;
  string name = 2;
  bytes arguments_json = 3;
}

message ProviderPrivateState {
  string provider_id = 1;
  string protocol = 2;
  string model = 3;
  string format = 4;
  string data = 5;
}

message ReasoningPart {
  repeated string summary = 1;
  ProviderPrivateState private_state = 2;
}

message RefusalPart {
  string text = 1;
}

message ModelTool {
  string name = 1;
  string description = 2;
  bytes input_schema_json = 3;
}

enum ModelRole {
  MODEL_ROLE_UNSPECIFIED = 0;
  MODEL_ROLE_SYSTEM = 1;
  MODEL_ROLE_USER = 2;
  MODEL_ROLE_ASSISTANT = 3;
  MODEL_ROLE_TOOL = 4;
}

enum ReasoningPolicy {
  REASONING_POLICY_UNSPECIFIED = 0;
  REASONING_POLICY_MINIMAL = 1;
  REASONING_POLICY_BALANCED = 2;
  REASONING_POLICY_THOROUGH = 3;
}

message ModelEvent {
  uint32 schema_version = 1;
  uint64 sequence = 2;
  oneof body {
    TextDelta text_delta = 3;
    ToolCall tool_call = 4;
    Usage usage = 5;
    Completed completed = 6;
    Failed failed = 7;
    Reasoning reasoning = 8;
    Refusal refusal = 9;
    PrivateStateOmitted private_state_omitted = 10;
  }
}

message TextDelta {
  string text = 1;
}

message ToolCall {
  string id = 1;
  string name = 2;
  bytes arguments_json = 3;
}

message Usage {
  uint64 input_tokens = 1;
  uint64 output_tokens = 2;
  uint64 cost_micros = 3;
}

message Completed {
  FinishReason reason = 1;
}

message Failed {
  ModelErrorKind kind = 1;
  bool retryable = 2;
  string message = 3;
}

message Reasoning {
  repeated string summary = 1;
  ProviderPrivateState private_state = 2;
}

message Refusal {
  string text = 1;
}

message PrivateStateOmitted {
  string origin_provider_id = 1;
  string target_provider_id = 2;
  string format = 3;
}

enum FinishReason {
  FINISH_REASON_UNSPECIFIED = 0;
  FINISH_REASON_STOP = 1;
  FINISH_REASON_TOOL_CALLS = 2;
  FINISH_REASON_LENGTH = 3;
  FINISH_REASON_CONTENT_FILTER = 4;
}

enum ModelErrorKind {
  MODEL_ERROR_KIND_UNSPECIFIED = 0;
  MODEL_ERROR_KIND_AUTHENTICATION = 1;
  MODEL_ERROR_KIND_BILLING = 2;
  MODEL_ERROR_KIND_RATE_LIMITED = 3;
  MODEL_ERROR_KIND_TIMEOUT = 4;
  MODEL_ERROR_KIND_PROTOCOL = 5;
  MODEL_ERROR_KIND_CONTEXT_OVERFLOW = 6;
  MODEL_ERROR_KIND_CAPABILITY_MISMATCH = 7;
  MODEL_ERROR_KIND_UNAVAILABLE = 8;
}

// Federated MCP tool calls (ADR-0040).
//
// Served by the same process as ModelExecution because that process is where
// sealed credentials are opened. A Worker that could open them would be a Worker
// holding a tenant's third-party credentials while executing a model's
// suggestions.
service McpFederation {
  rpc ListTools(McpListToolsRequest) returns (McpListToolsResponse);
  rpc CallTool(McpCallToolRequest) returns (McpCallToolResponse);
  rpc ListResources(McpListResourcesRequest) returns (McpListResourcesResponse);
  rpc ReadResource(McpReadResourceRequest) returns (McpReadResourceResponse);
  rpc ListResourceTemplates(McpListResourceTemplatesRequest) returns (McpListResourceTemplatesResponse);
  rpc ListPrompts(McpListPromptsRequest) returns (McpListPromptsResponse);
  rpc GetPrompt(McpGetPromptRequest) returns (McpGetPromptResponse);
}

message McpServerRef {
  string server_id = 1;
  // Namespace in qualified tool names: mcp:<name>/<tool>.
  string name = 2;
  // The only host the federation client may reach for this server.
  string endpoint = 3;
  // Sealed. Opened by the gateway and by nothing else.
  bytes credential_envelope_json = 4;
  // Run-frozen wire revision. Empty decodes only as the legacy revision for
  // read compatibility; new callers always send an explicit value.
  string protocol_revision = 5;
  // Client authority the Run delegated to this server (currently elicitation).
  repeated string client_capabilities = 6;
  // Stable credential-domain handle. OAuth token material never crosses this wire.
  string oauth_credential_id = 7;
}

message McpListToolsRequest {
  uint32 schema_version = 1;
  string tenant_id = 2;
  string run_id = 3;
  McpServerRef server = 4;
  // Carried so the workload token can be bound to the whole identity rather
  // than to a tenant a caller asserted about itself. The server checks these
  // against the signed claims and refuses on any mismatch.
  string attempt_id = 5;
  string worker_id = 6;
  string worker_incarnation_id = 7;
  // v2: complete immutable invocation identity signed by workload-token v4.
  string application_id = 8;
  string workload_identity_id = 9;
  string session_id = 10;
  string workspace_id = 11;
  string agent_version_id = 12;
}

message McpTool {
  string qualified_name = 1;
  string description = 2;
  bytes input_schema_json = 3;
}

message McpListToolsResponse {
  uint32 schema_version = 1;
  repeated McpTool tools = 2;
  // What the Run freezes and presents on every later call. Schema v2 binds the
  // whole advertised directory (Tools/Resources/Prompts), not only Tool rows.
  string catalog_digest = 3;
  // Schema v2. Server-advertised surfaces are discovery facts, never grants.
  // A resource- or prompt-only server therefore remains observable without
  // being misreported as an unavailable Tool server.
  repeated string server_capabilities = 4;
}

message McpCallToolRequest {
  uint32 schema_version = 1;
  string tenant_id = 2;
  string run_id = 3;
  McpServerRef server = 4;
  string qualified_name = 5;
  bytes arguments_json = 6;
  // The digest discovered at Run start. A server whose catalog changed since
  // then does not get to change what this Run may do.
  string frozen_catalog_digest = 7;
  string attempt_id = 8;
  string worker_id = 9;
  string worker_incarnation_id = 10;
  // Empty for the first round. Later rounds carry the protocol-neutral,
  // checkpointed McpInputContinuation JSON; the gateway translates it to the
  // selected MCP wire revision without owning user-interaction state.
  bytes input_continuation_json = 11;
  // v2: complete immutable invocation identity signed by workload-token v4.
  string application_id = 12;
  string workload_identity_id = 13;
  string session_id = 14;
  string workspace_id = 15;
  string agent_version_id = 16;
}

message McpCallToolResponse {
  uint32 schema_version = 1;
  bytes content_json = 2;
  // The server reported the call failed. Distinct from a transport failure: the
  // model should see this, and nothing should be retried.
  bool is_error = 3;
  // Non-empty only when the modern MCP server returned input_required. The
  // Worker persists this typed round before asking a user and sends the answer
  // back in input_continuation_json on a fresh RPC.
  bytes input_required_json = 4;
}

// Complete Run-bound authority shared by read-only MCP surface operations.
// Schema v1 requires workload-token v4 and does not admit the legacy partial
// identity accepted by the original Tool RPCs during their rolling upgrade.
message McpReadContext {
  uint32 schema_version = 1;
  string tenant_id = 2;
  string application_id = 3;
  string workload_identity_id = 4;
  string run_id = 5;
  string session_id = 6;
  string workspace_id = 7;
  string agent_version_id = 8;
  string attempt_id = 9;
  string worker_id = 10;
  string worker_incarnation_id = 11;
  McpServerRef server = 12;
  // Whole capability/Tool directory frozen by this Run.
  string frozen_catalog_digest = 13;
}

message McpListResourcesRequest {
  McpReadContext context = 1;
  // Opaque Server cursor. Empty means the first page.
  string cursor = 2;
}

message McpResourceDescriptor {
  string uri = 1;
  string name = 2;
  string title = 3;
  string description = 4;
  string mime_type = 5;
  optional uint64 size = 6;
}

message McpListResourcesResponse {
  uint32 schema_version = 1;
  repeated McpResourceDescriptor resources = 2;
  string next_cursor = 3;
}

message McpReadResourceRequest {
  McpReadContext context = 1;
  string uri = 2;
}

message McpResourceContent {
  string uri = 1;
  string mime_type = 2;
  oneof body {
    string text = 3;
    bytes blob = 4;
  }
}

message McpReadResourceResponse {
  uint32 schema_version = 1;
  repeated McpResourceContent contents = 2;
}

message McpListResourceTemplatesRequest {
  McpReadContext context = 1;
  string cursor = 2;
}

message McpResourceTemplateDescriptor {
  string uri_template = 1;
  string name = 2;
  string title = 3;
  string description = 4;
  string mime_type = 5;
}

message McpListResourceTemplatesResponse {
  uint32 schema_version = 1;
  repeated McpResourceTemplateDescriptor resource_templates = 2;
  string next_cursor = 3;
}

message McpListPromptsRequest {
  McpReadContext context = 1;
  string cursor = 2;
}

message McpPromptArgument {
  string name = 1;
  string description = 2;
  bool required = 3;
}

message McpPromptDescriptor {
  string name = 1;
  string title = 2;
  string description = 3;
  repeated McpPromptArgument arguments = 4;
}

message McpListPromptsResponse {
  uint32 schema_version = 1;
  repeated McpPromptDescriptor prompts = 2;
  string next_cursor = 3;
}

message McpGetPromptRequest {
  McpReadContext context = 1;
  string name = 2;
  // Object of string values. Empty bytes mean no arguments.
  bytes arguments_json = 3;
}

message McpPromptMessage {
  string role = 1;
  bytes content_json = 2;
}

message McpGetPromptResponse {
  uint32 schema_version = 1;
  string description = 2;
  repeated McpPromptMessage messages = 3;
}
