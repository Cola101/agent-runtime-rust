apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: runtime-allow-required-flows
  namespace: agent-runtime
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/part-of: agent-runtime}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: agent-runtime}
      ports:
        - {protocol: TCP, port: 50051}
        - {protocol: TCP, port: 50052}
        - {protocol: TCP, port: 8080}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: agent-runtime}
      ports:
        - {protocol: TCP, port: 4222}
        - {protocol: TCP, port: 50051}
        - {protocol: TCP, port: 50052}
    - ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 8200}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: control-plane-metrics-ingress
  namespace: agent-runtime
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: control-plane}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
      ports:
        - {protocol: TCP, port: 9090}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: control-plane-database-egress
  namespace: agent-runtime
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: control-plane}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: platform}
      ports:
        - {protocol: TCP, port: 5432}
