apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: control-plane-secrets
  namespace: agent-runtime
spec:
  provider: vault
  secretObjects:
    - secretName: control-plane-credentials
      type: Opaque
      data:
        - {objectName: database-username, key: database-username}
        - {objectName: database-password, key: database-password}
        - {objectName: nats-username, key: nats-username}
        - {objectName: nats-password, key: nats-password}
        - {objectName: nats-truststore-password, key: nats-truststore-password}
        - {objectName: workload-identity-private-key-pkcs8, key: workload-identity-private-key-pkcs8}
        - {objectName: skill-signing-key-id, key: skill-signing-key-id}
        - {objectName: skill-signing-private-key-pkcs8, key: skill-signing-private-key-pkcs8}
        - {objectName: management-scrape-username, key: management-scrape-username}
        - {objectName: management-scrape-password, key: management-scrape-password}
        - {objectName: management-ca.pem, key: management-ca.pem}
  parameters:
    roleName: agent-runtime-control-plane
    vaultAddress: https://vault.platform.svc:8200
    objects: |
      - objectName: database-username
        secretPath: agent-runtime/data/control-plane-database
        secretKey: username
      - objectName: database-password
        secretPath: agent-runtime/data/control-plane-database
        secretKey: password
      - objectName: nats-username
        secretPath: agent-runtime/data/nats-control-plane
        secretKey: username
      - objectName: nats-password
        secretPath: agent-runtime/data/nats-control-plane
        secretKey: password
      - objectName: nats-truststore.p12
        secretPath: agent-runtime/data/nats-control-plane
        secretKey: truststore.p12
        encoding: base64
      - objectName: nats-truststore-password
        secretPath: agent-runtime/data/nats-control-plane
        secretKey: truststore-password
      - objectName: workload-identity-private-key-pkcs8
        secretPath: agent-runtime/data/workload-identity
        secretKey: private-key-pkcs8
      - objectName: skill-signing-key-id
        secretPath: agent-runtime/data/skill-signing
        secretKey: key-id
      - objectName: skill-signing-private-key-pkcs8
        secretPath: agent-runtime/data/skill-signing
        secretKey: private-key-pkcs8
      - objectName: management-server-cert.pem
        secretPath: agent-runtime/data/control-plane-management-tls
        secretKey: tls.crt
      - objectName: management-server-key.pem
        secretPath: agent-runtime/data/control-plane-management-tls
        secretKey: tls.key
      - objectName: management-ca.pem
        secretPath: agent-runtime/data/control-plane-management-tls
        secretKey: ca.crt
      - objectName: postgres-ca.pem
        secretPath: agent-runtime/data/control-plane-database
        secretKey: ca.crt
      - objectName: management-scrape-username
        secretPath: agent-runtime/data/control-plane-metrics
        secretKey: username
      - objectName: management-scrape-password
        secretPath: agent-runtime/data/control-plane-metrics
        secretKey: password
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: runtime-gateway-secrets
  namespace: agent-runtime
spec:
  provider: vault
  secretObjects:
    - secretName: runtime-gateway-credentials
      type: Opaque
      data:
        - objectName: provider-api-key
          key: provider-api-key
        - objectName: checkpoint-s3-access-key-id
          key: checkpoint-s3-access-key-id
        - objectName: checkpoint-s3-secret-access-key
          key: checkpoint-s3-secret-access-key
        - objectName: workload-identity-public-key
          key: workload-identity-public-key
  parameters:
    roleName: agent-runtime-gateway
    vaultAddress: https://vault.platform.svc:8200
    objects: |
      - objectName: grpc-server-cert.pem
        secretPath: agent-runtime/data/gateway-grpc
        secretKey: tls.crt
      - objectName: grpc-server-key.pem
        secretPath: agent-runtime/data/gateway-grpc
        secretKey: tls.key
      - objectName: grpc-client-ca.pem
        secretPath: agent-runtime/data/gateway-grpc
        secretKey: client-ca.crt
      - objectName: provider-api-key
        secretPath: agent-runtime/data/model-provider
        secretKey: api-key
      - objectName: checkpoint-s3-access-key-id
        secretPath: agent-runtime/data/checkpoint-store
        secretKey: access-key-id
      - objectName: checkpoint-s3-secret-access-key
        secretPath: agent-runtime/data/checkpoint-store
        secretKey: secret-access-key
      - objectName: workload-identity-public-key
        secretPath: agent-runtime/data/workload-identity
        secretKey: public-key
---
