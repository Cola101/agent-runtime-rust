management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

spring:
  security:
    user:
      name: ${MANAGEMENT_SCRAPE_USERNAME:metrics-scraper}
      password: ${MANAGEMENT_SCRAPE_PASSWORD}
